name: Publish Status Page
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Upptime Checks]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/site.yml'
permissions:
  contents: read
concurrency:
  group: upptime-page
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify that real monitoring data exists
        run: node -e "const fs=require('node:fs');const data=JSON.parse(fs.readFileSync('api/status.json','utf8'));if(data.sites.length!==3)process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
