status-website:
  cname: status.istsong.com
  name: XINQISONG · 站点状态
  logoUrl: https://status.istsong.com/logo.svg
  faviconSvg: https://status.istsong.com/logo.svg
  theme: dark
  introTitle: "**每一次访问，都值得被认真对待。**"
  introMessage: "这里记录个人主站与技术笔记的可用情况。约每 5 分钟计划检查一次；数据来自监测节点，历史从启用监测后逐步积累。"
  navbar:
    - title: 站点状态
      href: /
    - title: 个人主站
      href: https://istsong.com/
    - title: 技术笔记
      href: https://blog.istsong.com/
  links:
    - rel: stylesheet
      href: /custom.css

